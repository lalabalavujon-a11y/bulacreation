<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8c6e28" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18150c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon Outline -->
  <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" 
           fill="url(#bgGrad)" 
           stroke="url(#goldGrad)" 
           stroke-width="3.5" 
           stroke-linejoin="round" 
           filter="url(#goldGlow)" />

  <!-- Inner Concentric Hexagon Grid / Circuit Lines -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" 
           fill="none" 
           stroke="#c9a84c" 
           stroke-width="1.5" 
           stroke-dasharray="2,3" 
           opacity="0.45" />

  <!-- Center Dynamic Hexagon Core -->
  <polygon points="50,28 68,39 68,61 50,72 32,61 32,39" 
           fill="url(#goldGrad)" 
           opacity="0.15" />

  <polygon points="50,33 64,41 64,59 50,67 36,59 36,41" 
           fill="none" 
           stroke="url(#goldGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Radiating Vertex Nodes -->
  <circle cx="50" cy="16" r="2.5" fill="#f3e5ab" />
  <circle cx="80" cy="33" r="2.5" fill="#c9a84c" />
  <circle cx="80" cy="67" r="2.5" fill="#c9a84c" />
  <circle cx="50" cy="84" r="2.5" fill="#c9a84c" />
  <circle cx="20" cy="67" r="2.5" fill="#c9a84c" />
  <circle cx="20" cy="33" r="2.5" fill="#c9a84c" />

  <!-- Center Core Node -->
  <circle cx="50" cy="50" r="3.5" fill="#f3e5ab" filter="url(#goldGlow)" />
</svg>